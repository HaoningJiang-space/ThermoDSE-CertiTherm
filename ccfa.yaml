    host: "moe-server"
    note: "zero wrong synthetic admissions, but real 681-cell tail retained 53.7% fallback at 10k iterations; gate failed"
  - id: "V6-1"
    status: "complete_out_of_family_diagnostic"
    command: "python research/triangle/v61_frozen_factorial.py <out> grid64-max 0.5 transformer arch_b"
    host: "moe-server"
    note: >-
      Four claim-grade runs (schemas 2-5, gate policies 1-3) agree on all 233-block temperature
      vectors of all 15 rows. Only the full four-source set crosses, by +0.19 K; every source's
      removal costs more than that excess, so leave-one-out necessity is an arithmetic consequence
      rather than a second finding. The informative measurement is that NoP carries 5.377% of the
      dissipated energy yet its removal drops the periodic peak by 0.41 K. Reported hottest-block
      names carry NO spatial claim: 9 of 15 rows are bit-identical ties from a shared boundary
      cell under GRID_MAX outward rounding, and 2 more are corner-DRAM symmetry with disjoint
      rectangles.
    disposition: >-
      OUT OF FAMILY. grid64-max is not in ("block","grid64-avg","grid128-avg"), so this
      counterexample cannot enter a DSOS certificate. Admitting max was costed and declined: no
      per-cell error contract, the cell dump is %.2f while the precision patch covers only block
      dumps, and reject LPs would go 233 -> 4096 per model. See
      docs/INFORMATION_THEORETIC_METHOD.md.
    evidence: "artifacts_receipts/v61_cg5_schema5/, docs/V6_1_CAUSAL_ISOLATION.md"
  - id: "INDEPENDENT-MODEL-GATE"
    status: "CLAIM_WITHDRAWN_WITHOUT_INDEPENDENT_VERDICT"
    terminal_outcome: >-
      Closed WITHOUT a verdict. No 3D-ICE or FEM run was performed and no gate output exists. The
      instrument cannot represent this package: ThreeDicePassiveLayerSpec carries no footprint and
      the chip dimensions are global, so a 21.7 x 17.95 mm die, a 50 mm spreader and a 60 mm sink
      cannot coexist; truncating them adds 44.921 mK/W (about 2.57 K at 57.18 W against a
      0.095133 K margin) and enlarging the global footprint would extend the silicon die as
      fictitious material. A composite predicate over two instruments was rejected as a category
      error: P* = S_FEM + U_3DICE is predicted by no solver. Best case was instance-bound
      diagnostic support for one out-of-family case, which could not promote the headline or enter
      a certificate.
    withdrawn_claim: >-
      That the grid64-max transformer/arch_b 330 K crossing is model-robust. Withdrawn BECAUSE
      MODEL-ROBUST SUPPORT COULD NOT BE ESTABLISHED -- explicitly NOT because an independent model
      disproved it. The >= 0.69 K intra-HotSpot spatial spread establishes fragility, not an
      in-family counterexample to transient flipping. This is not a convergence result and must
      never be described as one.
    preregistration: "docs/registration/v7_independent_model_gate.json"
    preregistration_sha256: "e6301a4b139677d55e578b21a78c09b890958984efa2507687e575a44b6ced47"
    stack_mapping: "docs/registration/v7_gate_stack_mapping.json"
    stack_mapping_sha256: "b1e35686cf5be8a2d38a728d6d60d5a22ef6863f20dad32397f3fd665cab885a"
    stack_mapping_state: "REJECTED_BEFORE_USE -- see docs/V7_GATE_MAPPING_REVIEW.md"
    mapping_rejection_reason: >-
      3D-ICE passive layers share one global footprint, so mapping v1 truncated HotSpot's 50 mm
      spreader and 60 mm sink to the 21.7 x 17.95 mm chip footprint. That adds 44.921 mK/W of
      series copper resistance, about 2.57 K at the instance's 57.18 W -- 27x the 0.095133 K
      steady margin under test. The preregistered STEADY_CLASSIFICATION_DISAGREES outcome would
      therefore have been produced by a known mapping limitation rather than by a model
      disagreement: the gate would have run cleanly and answered nothing. No gate output has been
      produced or examined. The decision rule, observables and guards are untouched; the
      rejection is of the mapping only. Review also found member B internally inconsistent (it
      deletes the copper resistance instead of folding it in: 10.00 W/K where 6.64 W/K is
      correct), and that the package IS representable after all by setting the global footprint to
      the package scale with the die centred and zero power outside it.
    host: "moe-server"
    note: >-
      The gate the adopted contract's stop rule requires before any new solver, kernel, feature
      family or headline theorem. Does the pinned transformer/arch_b boundary case reproduce its
      steady-safe/periodic-unsafe classification under 3D-ICE 4.0? The decision rule, observable
      definitions, interval construction, guards and allowed conclusions live in the
      preregistration artifact, NOT here -- so a reader of any later checkout can tell what was
      fixed before execution. Its prior_prediction block is a prior, never a result, must not be
      overwritten, and the outcome goes in a separate receipt referencing the hash above.
  - id: "V7-TRANSIENT-LOCALITY"
    status: "complete_measured_from_committed_data"
    command: "python research/triangle/v7_locality_report.py docs/V7_TRANSIENT_LOCALITY.md"
    host: "local (no solver run; derived from the schema-5 manifest)"
    note: >-
      The positive result the closed gate produced. Going from the core-only subset to the full
      four-source set adds 45.0% of the dissipated energy and moves the steady rise by +3.636 K
      while the periodic uplift moves by at most 0.024 K once the 0.01 K output quantum is bounded
      in -- a sensitivity ratio of at least 152x. Across the 8 core-containing subsets, where
      energy still varies 1.8x, corr(energy, steady rise) = +0.989 against corr(energy, uplift) =
      +0.164. The explanation is a diffusion length: at the 2469 Hz workload period the silicon
      penetration depth is 101.4 um against a 150 um die, and 11.4 um in the 20 um TIM, so the
      periodic component never reaches the package.
    criterion: >-
      Transient refinement is decision-relevant exactly when the steady margin is smaller than the
      LOCAL ripple. The ripple follows from die properties and workload frequency with no package
      model; the absolute level, which is what a threshold crossing depends on, is precisely the
      package-dependent part. Hence the uplift is a robust feature while the crossing is not
      certifiable at 0.1 K.
    scope: >-
      One candidate, one workload period, one HotSpot model, and grid64-max is out of the
      certified family -- NOT certificate evidence. delta is a 1-D semi-infinite estimate giving
      the scale, not a predicted uplift; the sensitivity ratio is the measurement. No independent
      thermal model has validated any number.
    evidence: "docs/V7_TRANSIENT_LOCALITY.md, artifacts_receipts/v61_cg5_schema5/"
  - id: "SCALE-SYNTH"
    status: "complete"
    command: "python -m research.dr_dsc.profile_synthesis / benchmark"
    note: "supports C4, C5, C6; synthetic operator"

