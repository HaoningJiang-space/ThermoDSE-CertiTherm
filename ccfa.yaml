claims:
  - id: "C0"
    status: "implemented_verified"
    text: >-
      Constraint generation reports a CERTIFIED plan distinctly from an
      uncertified working cover, and never presents the latter as an upper
      bound or a certificate.
    evidence:
      - "CertiTherm/synthesis.py: ObservationPlan.selected_action_ids vs candidate_action_ids"
      - "commit 4b9d14f (bug: budget exhaustion returned the empty-cut master's selection)"
      - "103/103 tests; measured 11-action cover of cost 31.0 previously reported as zero actions"

  - id: "C1"
    status: "implemented_verified"
    text: >-
      An anytime lower bound on the minimum-cost contract is certified by weak
      duality rather than trusted from the solver, so solver error can loosen
      it but never invalidate it.
    evidence:
      - "CertiTherm/synthesis.py::_anytime_lower_bound"
      - "commits 2d07ee6, baae152, and 8661168"
      - "1000 random instances, costs 1e-3..1e3: 0 violations of LB <= integer optimum, 0 monotonicity violations"
    caveat: >-
      The weak-duality expression is evaluated in exact Fraction arithmetic
      over the registered binary cuts and exact dyadic values of the input
      floats. Export to float is directed downward. This proves the endpoint
      for the represented instance; it does not prove collision-oracle
      completeness or the physical model itself.

  - id: "C2"
    status: "implemented_verified"
    text: >-
      A final exhaustive separation pass promotes the last cover to a certified
      plan when it holds, yielding a genuine upper bound and a real gap; the
      empty contract is a valid certified plan when the decision is already
      invariant.
    evidence:
      - "CertiTherm/synthesis.py: CERTIFIED_PLAN branch; commit a3b6e97"
      - "regression fixtures cover certified bounded-gap, exact closure, empty-contract, and interval-ordering cases"
      - "241-action instance: correctly does NOT promote at 60/250/1000 iterations"

  - id: "C3"
    status: "implemented_verified"
    text: >-
      Epistemic failures become progress-preserving UNRESOLVED while
      programming defects keep propagating, classified at the origin rather
      than by exception class at the API boundary.
    evidence:
      - "CertiTherm/synthesis.py: UnresolvedComputation, ContractViolation; commit 9c4a9bc"
      - "fault injection: 9 defect classes propagate; classified failures preserve iterations/witnesses/candidate"
      - "load-bearing detail: np.linalg.LinAlgError subclasses ValueError, so a boundary ValueError catch absorbed defect-origin singular-matrix failures"

  - id: "C4"
    status: "measured_synthetic_only"
    text: >-
      The default 8-worker separation configuration is a ~32x pessimization at
      this instance size: a fresh spawn-context pool is built per iteration to
      dispatch twelve ~5-6 ms LPs.
    evidence:
      - "sequential 1.59s/25 iters (0.064 s/iter) vs 8-worker 51.72s/25 iters (2.07 s/iter); ratio 32.5x"
      - "research/dr_dsc/profile_synthesis.py; commit 11d057a"
    caveat: >-
      Measured on the synthetic-operator instance only. The ~2 s/iteration
      overhead is an unseparated mixture of spawn, per-worker import, pickling,
      IPC and teardown and must not be attributed to any single one.

  - id: "C5"
    status: "measured_synthetic_only_not_generalizable"
    text: >-
      On a 241-action instance with a synthetic sharply-local thermal kernel,
      constraint generation does not close within 5000 sequential iterations,
      and the certified lower bound reaches 169.17 against a full-library cost
      of 1842 while still rising.
    evidence:
      - "sequential 5000 iters, 461s, UNRESOLVED, antichain 5840 cuts, exactly 2 collisions/iteration"
      - "bound sweep 16.0 / 21.0 / 31.325 / 169.167 at 60 / 250 / 1000 / 5000 iterations"
    caveat: >-
      The placed power vector and thermal operator are SYNTHETIC; only the
      floorplan and action registry are real. This says nothing about real
      HotSpot operators. Non-closure is shown, not explained -- a positive
      lower bound indicates intrinsic expense but does not exclude separation
      or heuristic quality as contributors.

  - id: "C6"
    status: "negative_retained"
    text: >-
      A differentiable proposal over the frozen action library (DR-DSC) does
      not beat plain cost-effectiveness greedy at realistic scale.
    evidence:
      - "241 actions, matched 60-round budget: learned 85.0 vs greedy 24.0, neither converged"
      - "research/dr_dsc/README.md; commit f23782f"
    caveat: >-
      Both runs unconverged, so this is not a comparison of final optima.
      Retained as a negative result per project policy. A known asymmetry
      favours greedy (adaptive gain recomputation vs a static learned order).

  - id: "C8"
    status: "measured_on_real_operators_INTERVAL_CLAIM_WITHDRAWN"
    text: >-
      With the timeout-preservation fix, a budget-exhausted query on REAL
      HotSpot operators reports a certified lower bound and a working cover
      instead of nothing. The cover is NOT an oracle-certified upper bound, so
      this is not an interval and cover-minus-bound is not an optimality gap.
      (Aligned 2026-07-27 with the status field, which has recorded
      INTERVAL_CLAIM_WITHDRAWN since 2026-07-22 while this text still asserted
      the withdrawn claim -- a reader who stopped at `text:` read a retracted
      claim as live. The caveat below is unchanged and remains authoritative.)
    evidence:
      - "resnet50/default, 3 candidates, 693 actions, 227 blocks, 300s per candidate"
      - "arch_b: LB 4.0, candidate 8.0, 1719 witnesses, 4 iterations"
      - "arch_c: LB 5.0, candidate 6.0, 1525 witnesses, 8 iterations"
      - "arch_a: LB 10.5, candidate 14.0, 1229 witnesses, 3 iterations"
    caveat: >-
      The word "interval" is WITHDRAWN. An interval needs a valid upper bound
      and the candidate cover is not one -- it is not oracle-certified, so
      candidate-minus-LB bounds nothing. What C8 actually shows is that a
      timed-out real-operator query now reports a certified lower bound and a
      working cover instead of nothing. These are candidate-LOCAL subproblem
      figures at a 300s budget, not the
      full-query optimum, and only 3-8 iterations completed. The candidate cost
      is NOT an upper bound, so candidate-minus-LB is not an optimality gap.
      The striking difference from the synthetic instance is the witness rate:
      ~1500 witnesses per iteration here versus exactly 2 there, so real
      instances have far more reject cells and far costlier iterations. Any
      extrapolation from the synthetic study to real operators must account for
      that.

  - id: "C7"
    status: "CONFIRMED_on_real_operators"
    text: >-
      Non-closure reproduces on REAL HotSpot operators: it is not an artifact
      of the synthetic kernel. On all 6 dev queries the exact path exhausts the
      frozen 1800s budget and returns UNRESOLVED, while every heuristic policy
      returns a CERTIFIED plan in 60-1600s.
    evidence:
      - "artifacts/dev-gpu/REPORT.md: exact status {OPTIMAL: 0, UNSYNTHESIZABLE: 0, UNRESOLVED: 6}"
      - "9 physical operators admitted, 270 direct replays, max replay residual 0.00149 K against the frozen 0.01 K bound"
      - "0 false certificates, 0 placed-reference model disagreements, max full-rank spectral residual 2.47e-13 K"
      - "certified costs: dual 4100-4132 < width 4174 < fixed 5242 < full registry 5250"
    evidence_gap_closed: >-
      2026-07-22: the dev report's bound columns were empty NOT because no
      bound existed but because `_timed_call` caught the SIGALRM TimeoutError
      and discarded the whole result. TimeoutError is now classified as an
      epistemic failure, so a budget-exhausted run returns UNRESOLVED carrying
      its iterations, witnesses, candidate cover and a freshly refreshed
      anytime lower bound. Verified under a real SIGALRM: 74 iterations, 234
      witnesses, an 11-action candidate at cost 26.0, and LB 15.0 all survive.
      A follow-up audit then found the first fix did NOT reach the reported
      symptom: the experiment calls synthesize_ordered_query, whose non-OPTIMAL
      path I had myself made return lower_bound=None out of over-caution about
      additivity. Theorem 2 gives C*_query = sum of required local optima and
      the action libraries are candidate-local and disjoint, so no double
      counting arises; bounds are non-negative, so summing only the candidates
      reached before a failure is a valid, merely weaker, query bound. Verified
      on the ordered path under a forced timeout: lower_bound 14.0 where it was
      previously None. The dev queries must be re-run to populate these columns; the existing
      dev artifacts predate the fix and their empty bounds are an artifact of
      it, not evidence that no bound was computable.
    consequence: >-
      This is the result that decides the paper narrative. Pursuing exact
      closure on every query is not viable at this scale, but a CERTIFIED plan
      exists and is cheap to find -- dual reaches 4100 against a 5250 full
      registry, a 22% saving. The anytime framing (certified lower bound,
      verified upper bound, real gap, counterexample) is therefore the
      defensible claim, and it is now implemented.
    threatens: >-
      docs/HELDOUT_PROTOCOL.md requires "resolvable or proved non-identifiable:
      at least 8 of 12 queries". Dev scored 0/6 on the exact path. If held-out
      resembles dev, that predeclared criterion fails as written. Changing it
      after seeing dev would be post-hoc tuning of a frozen protocol and must
      instead go through a new freeze ID.

